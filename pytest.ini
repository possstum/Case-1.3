[pytest]
addopts = -ra
testpaths =
    apps/control-plane/tests
    apps/gpu-worker/tests
    data/validator/tests
norecursedirs =
    .git
    .venv
    __pycache__
markers =
    unit: fast isolated tests
    integration: tests that use the filesystem, database, or network boundaries
    slow: slower end-to-end style tests
