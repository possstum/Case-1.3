services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lyrics2song
      POSTGRES_USER: lyrics2song
      POSTGRES_PASSWORD: lyrics2song
    ports:
      - "15432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U lyrics2song -d lyrics2song" ]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
    volumes:

      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c " until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done && mc mb --ignore-existing local/lyrics2song-results && mc anonymous set public local/lyrics2song-results "

  control-plane:
    build:
      context: ./apps/control-plane
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+psycopg://lyrics2song:lyrics2song@postgres:5432/lyrics2song
      REDIS_URL: redis://redis:6379/0
      QUEUE_NAME: lyrics2song-jobs
      QUEUE_MODE: rq
      API_KEYS: dev-api-key
      JWT_SECRET: dev-jwt-secret
      AVAILABLE_MODELS: lyrics2song-demo-v1
      RESULT_DELIVERY: public
    ports:
      - "8000:8000"
    volumes:
      - ./apps/control-plane/app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  gpu-worker:
    profiles:
      - gpu
    build:
      context: ./apps/gpu-worker
    command: python worker.py
    environment:
      DATABASE_URL: postgresql+psycopg://lyrics2song:lyrics2song@postgres:5432/lyrics2song
      REDIS_URL: redis://redis:6379/0
      QUEUE_NAME: lyrics2song-jobs
      PROGRESS_CHANNEL: lyrics2song-job-progress
      S3_BUCKET: lyrics2song-results
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_BASE_URL: http://127.0.0.1:9000/lyrics2song-results
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"
      YUE_RUNNER: cli
      YUE_WORKDIR: /opt/yue/inference
      YUE_INFER_SCRIPT: infer.py
    volumes:
      - ./apps/gpu-worker/worker.py:/app/worker.py
      - ${YUE_HOST_PATH:-./.yue-not-mounted}:/opt/yue:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  minio_data:
