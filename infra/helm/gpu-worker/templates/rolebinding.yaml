{{- if and .Values.serviceAccount.create .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "gpu-worker.fullname" . }}-binding
  labels:
    {{- include "gpu-worker.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "gpu-worker.roleName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "gpu-worker.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
