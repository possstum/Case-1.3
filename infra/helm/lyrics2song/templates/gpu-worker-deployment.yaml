apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lyrics2song.fullname" . }}-gpu-worker
  labels:
    app.kubernetes.io/name: {{ include "lyrics2song.name" . }}
    app.kubernetes.io/component: gpu-worker
spec:
  replicas: {{ .Values.gpuWorker.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "lyrics2song.name" . }}
      app.kubernetes.io/component: gpu-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "lyrics2song.name" . }}
        app.kubernetes.io/component: gpu-worker
    spec:
      containers:
        - name: gpu-worker
          image: "{{ .Values.gpuWorker.image.repository }}:{{ .Values.gpuWorker.image.tag }}"
          imagePullPolicy: {{ .Values.gpuWorker.image.pullPolicy }}
          env:
            - name: DATABASE_URL
              value: {{ .Values.gpuWorker.env.databaseUrl | quote }}
            - name: REDIS_URL
              value: {{ .Values.gpuWorker.env.redisUrl | quote }}
            - name: QUEUE_NAME
              value: {{ .Values.gpuWorker.env.queueName | quote }}
            - name: PROGRESS_CHANNEL
              value: {{ .Values.gpuWorker.env.progressChannel | quote }}
            - name: S3_BUCKET
              value: {{ .Values.gpuWorker.env.s3Bucket | quote }}
            - name: S3_ENDPOINT_URL
              value: {{ .Values.gpuWorker.env.s3EndpointUrl | quote }}
            - name: S3_PUBLIC_BASE_URL
              value: {{ .Values.gpuWorker.env.s3PublicBaseUrl | quote }}
            - name: S3_ACCESS_KEY_ID
              value: {{ .Values.gpuWorker.env.s3AccessKeyId | quote }}
            - name: S3_SECRET_ACCESS_KEY
              value: {{ .Values.gpuWorker.env.s3SecretAccessKey | quote }}
            - name: YUE_RUNNER
              value: {{ .Values.gpuWorker.env.yueRunner | quote }}
            - name: YUE_WORKDIR
              value: {{ .Values.gpuWorker.env.yueWorkdir | quote }}
            - name: YUE_INFER_SCRIPT
              value: {{ .Values.gpuWorker.env.yueInferScript | quote }}
