apiVersion: v1
kind: Service
metadata:
  name: {{ include "lyrics2song.fullname" . }}-control-plane
  labels:
    app.kubernetes.io/name: {{ include "lyrics2song.name" . }}
    app.kubernetes.io/component: control-plane
spec:
  type: {{ .Values.controlPlane.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "lyrics2song.name" . }}
    app.kubernetes.io/component: control-plane
  ports:
    - name: http
      port: {{ .Values.controlPlane.service.port }}
      targetPort: http

