apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lyrics2song.fullname" . }}-control-plane
  labels:
    app.kubernetes.io/name: {{ include "lyrics2song.name" . }}
    app.kubernetes.io/component: control-plane
spec:
  replicas: {{ .Values.controlPlane.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "lyrics2song.name" . }}
      app.kubernetes.io/component: control-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "lyrics2song.name" . }}
        app.kubernetes.io/component: control-plane
    spec:
      containers:
        - name: control-plane
          image: "{{ .Values.controlPlane.image.repository }}:{{ .Values.controlPlane.image.tag }}"
          imagePullPolicy: {{ .Values.controlPlane.image.pullPolicy }}
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: DATABASE_URL
              value: {{ .Values.controlPlane.env.databaseUrl | quote }}
            - name: REDIS_URL
              value: {{ .Values.controlPlane.env.redisUrl | quote }}
            - name: QUEUE_NAME
              value: {{ .Values.controlPlane.env.queueName | quote }}
            - name: API_KEYS
              value: {{ .Values.controlPlane.env.apiKeys | quote }}
            - name: AVAILABLE_MODELS
              value: {{ .Values.controlPlane.env.availableModels | quote }}
